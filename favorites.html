<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>收藏 - 数字中国政策库</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- 顶部标题区 -->
    <header class="app-header">
        <div class="header-top">
            <h1 class="main-title">我的收藏</h1>
            <p class="sub-title">收藏的政策文档</p>
        </div>
    </header>

    <!-- 分类标签 -->
    <div class="category-tabs">
        <button class="tab active" data-tab="all">全部 (0)</button>
        <button class="tab" data-tab="policy">政策 (0)</button>
        <button class="tab" data-tab="topic">专题 (0)</button>
        <button class="tab" data-tab="folder">文件夹</button>
    </div>

    <!-- 收藏内容 -->
    <main class="favorites-page">
        <!-- 空状态 -->
        <div class="empty-state" id="emptyState">
            <svg width="80" height="80" viewBox="0 0 24 24" fill="currentColor">
                <path d="M17 3H7c-1.1 0-1.99.9-1.99 2L5 21l7-3 7 3V5c0-1.1-.9-2-2-2z"/>
            </svg>
            <p>还没有收藏内容</p>
            <p class="hint">浏览政策时点击收藏按钮即可添加</p>
            <button class="primary-btn" onclick="window.location.href='index.html'">去首页看看</button>
        </div>

        <!-- 收藏列表（示例数据） -->
        <div class="favorites-list" id="favoritesList" style="display: none;">
            <!-- 示例收藏项目 -->
            <article class="favorite-item" onclick="location.href='topic-detail.html'">
                <div class="favorite-icon">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M14 2H6c-1.1 0-1.99.9-1.99 2L4 20c0 1.1.89 2 1.99 2H18c1.1 0 2-.9 2-2V8l-6-6zm2 16H8v-2h8v2zm0-4H8v-2h8v2zm-3-5V3.5L18.5 9H13z"/>
                    </svg>
                </div>
                <div class="favorite-info">
                    <h3>人工智能发展政策汇编</h3>
                    <p>包含2020-2024年AI相关政策文件</p>
                    <div class="favorite-meta">
                        <span class="count">23篇政策</span>
                        <span class="time">收藏于 2024-06-09</span>
                    </div>
                </div>
                <button class="unfavorite-btn" onclick="event.stopPropagation(); removeFavorite(this)">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/>
                    </svg>
                </button>
            </article>

            <article class="favorite-item" onclick="location.href='topic-detail.html'">
                <div class="favorite-icon">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M14 2H6c-1.1 0-1.99.9-1.99 2L4 20c0 1.1.89 2 1.99 2H18c1.1 0 2-.9 2-2V8l-6-6zm2 16H8v-2h8v2zm0-4H8v-2h8v2zm-3-5V3.5L18.5 9H13z"/>
                    </svg>
                </div>
                <div class="favorite-info">
                    <h3>数据要素市场化配置</h3>
                    <p>数据产权、流通交易、收益分配相关政策</p>
                    <div class="favorite-meta">
                        <span class="count">15篇政策</span>
                        <span class="time">收藏于 2024-06-08</span>
                    </div>
                </div>
                <button class="unfavorite-btn" onclick="event.stopPropagation(); removeFavorite(this)">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/>
                    </svg>
                </button>
            </article>

            <article class="favorite-item" onclick="location.href='topic-detail.html'">
                <div class="favorite-icon">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M14 2H6c-1.1 0-1.99.9-1.99 2L4 20c0 1.1.89 2 1.99 2H18c1.1 0 2-.9 2-2V8l-6-6zm2 16H8v-2h8v2zm0-4H8v-2h8v2zm-3-5V3.5L18.5 9H13z"/>
                    </svg>
                </div>
                <div class="favorite-info">
                    <h3>数字政府建设指南</h3>
                    <p>政务数字化转型与服务体系优化</p>
                    <div class="favorite-meta">
                        <span class="count">8篇政策</span>
                        <span class="time">收藏于 2024-06-07</span>
                    </div>
                </div>
                <button class="unfavorite-btn" onclick="event.stopPropagation(); removeFavorite(this)">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/>
                    </svg>
                </button>
            </article>

            <article class="favorite-item" onclick="location.href='topic-detail.html'">
                <div class="favorite-icon">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M14 2H6c-1.1 0-1.99.9-1.99 2L4 20c0 1.1.89 2 1.99 2H18c1.1 0 2-.9 2-2V8l-6-6zm2 16H8v-2h8v2zm0-4H8v-2h8v2zm-3-5V3.5L18.5 9H13z"/>
                    </svg>
                </div>
                <div class="favorite-info">
                    <h3>新型基础设施建设规划</h3>
                    <p>5G、数据中心、工业互联网建设政策</p>
                    <div class="favorite-meta">
                        <span class="count">12篇政策</span>
                        <span class="time">收藏于 2024-06-05</span>
                    </div>
                </div>
                <button class="unfavorite-btn" onclick="event.stopPropagation(); removeFavorite(this)">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/>
                    </svg>
                </button>
            </article>
        </div>
    </main>

    <!-- 底部导航 -->
    <nav class="bottom-nav">
        <a href="index.html" class="nav-item">

            <span>收藏</span>

    <script src="js/main.js"></script>
